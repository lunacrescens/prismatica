# Builds every Prismatica download. Push a tag like v1.0.1 and the files are attached to a new GitHub Release
# under the exact names the website links to. Run it by hand (Actions > Release > Run workflow) to just build
# and download the files without releasing.
#
# The Ripple Tank screensaver is built first and packed into every desktop zip, in a "Screensaver" folder.
# It isn't released on its own.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screensaver-windows:
    name: Screensaver (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S screensaver -B build -A x64
          cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4    # handed to the Electron job, not released
        with:
          name: saver-windows
          path: build/Release/Prismatica Ripple Tank.scr
          if-no-files-found: error

  screensaver-macos:
    name: Screensaver (macOS universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (Intel + Apple Silicon)
        run: |
          cmake -S screensaver -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --parallel
      - name: Sign (ad-hoc) and pack
        run: |
          mkdir -p out
          cp -R "build/Prismatica Ripple Tank.saver" "build/Prismatica Ripple Tank HD.saver" out/
          for b in out/*.saver; do codesign --force --deep --sign - "$b"; done
          # each bundle's program must match its Info.plist and contain both architectures
          for b in out/*.saver; do
            exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$b/Contents/Info.plist")
            lipo "$b/Contents/MacOS/$exe" -verify_arch arm64 x86_64
            lipo -info "$b/Contents/MacOS/$exe"
          done
          # artifacts drop Unix permissions, so the bundles travel as a tarball
          tar -czf saver-macos.tgz -C out .
      - uses: actions/upload-artifact@v4    # handed to the Electron job, not released
        with:
          name: saver-macos
          path: saver-macos.tgz
          if-no-files-found: error

  electron-windows:
    name: Electron (Windows)
    needs: screensaver-windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: saver-windows
          path: electron/saver
      - run: npm ci
      - run: npm run dist:win
        env:
          SCREENSAVER_DIR: saver
      - uses: actions/upload-artifact@v4
        with:
          name: dist-electron-windows
          path: electron/dist/*.zip
          if-no-files-found: error

  electron-macos:
    name: Electron (macOS)
    needs: screensaver-macos
    runs-on: macos-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: saver-macos
          path: electron
      - run: mkdir -p saver && tar -xzf saver-macos.tgz -C saver && ls saver
      - run: npm ci
      - run: npm run dist:mac
        env:
          SCREENSAVER_DIR: saver
      - uses: actions/upload-artifact@v4
        with:
          name: dist-electron-macos
          path: electron/dist/*.zip
          if-no-files-found: error

  electron-linux:
    name: Electron (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: dist-electron-linux
          path: electron/dist/*.tar.gz
          if-no-files-found: error

  browser:
    name: Browser version (single HTML file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 electron/scripts/make-html.py out/Prismatica.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist-browser
          path: out/Prismatica.html
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [electron-windows, electron-macos, electron-linux, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: files
          merge-multiple: true
      - run: ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
          body: |
            Download Prismatica for your system, or [try it in your browser](https://lunacrescens.github.io/prismatica/play/) with your own music files.
            The desktop app adds system audio and microphone input.

            | | Windows | macOS | Linux |
            |---|---|---|---|
            | Prismatica | `Prismatica-Electron-Windows-x64.zip` | `Prismatica-Electron-Mac-AppleSilicon-arm64.zip` (Apple Silicon) / `Prismatica-Electron-Mac-Intel-x64.zip` (Intel) | `Prismatica-Electron-Linux-x64.tar.gz` |
            | Browser version | `Prismatica.html` | `Prismatica.html` | `Prismatica.html` |

            The Windows and macOS downloads include the **Ripple Tank screensaver** in a `Screensaver` folder.

            The apps aren't signed with a paid certificate. Windows: More info → Run anyway. macOS: System Settings → Privacy & Security → Open Anyway. Linux: see README.txt in the download if it won't start.
