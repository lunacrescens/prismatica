# Publishes website/ to GitHub Pages (https://lunacrescens.github.io/prismatica/) on every push to main.
# The browser visualizer at play/ is rebuilt from the Electron app's source first, so it never goes stale.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'electron/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the browser visualizer
        run: python3 electron/scripts/make-html.py website/play/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
